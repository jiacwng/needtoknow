# Local services. The database is reachable from this machine only.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: needtoknow
      POSTGRES_PASSWORD: needtoknow
      POSTGRES_DB: needtoknow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needtoknow -d needtoknow"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Development login server. The realm in keycloak/ holds the 12 employees, each with the
  # password needtoknow; the admin console account is admin / admin.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/8080 &&
          printf 'GET /realms/needtoknow/.well-known/openid-configuration HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '^HTTP/1.[01] 200' <&3
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  db-data:
