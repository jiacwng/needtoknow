name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: needtoknow
          POSTGRES_PASSWORD: needtoknow
          POSTGRES_DB: needtoknow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U needtoknow -d needtoknow"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PGHOST: localhost
      PGUSER: needtoknow
      PGPASSWORD: needtoknow
      PGDATABASE: needtoknow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest
      - name: pgvector is available
        run: psql -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector" -c "SELECT extversion FROM pg_extension WHERE extname = 'vector'"
