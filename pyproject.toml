[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "needtoknow"
version = "0.0.0"
description = "A company AI assistant that never uses a document the person asking cannot open."
requires-python = ">=3.12"
authors = [{ name = "Wang Jiacheng" }]
dependencies = ["psycopg[binary]>=3.3"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["needtoknow"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom
"tests/**" = ["S101"]

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
